[project]
name = "ea-unstructured-data"
version = "0.1.0"
description = "Unstructured data processing for AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.8.0",
    "uvicorn>=0.29.0",
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.25.1",
    "msal>=1.34.0",
    "httpx>=0.27.0",
    "aiohttp>=3.13.2",
    "azure-functions>=1.24.0",
    "azure-storage-blob>=12.19.0",
    "azure-storage-queue>=12.9.0",
    "azure-ai-documentintelligence>=1.0.2",
    "python-multipart>=0.0.6",
    "llama-index-core>=0.10.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "pip>=26.0",
    "ddtrace>=4.4.0",
    "datadog-serverless-compat>=0.13.0",
    "chonkie[semantic,tiktoken]>=1.0.0",
    "dependency-injector>=4.48.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aioodbc>=0.5.0",
    "alembic>=1.14.0",
    "pyodbc>=5.2.0",
    "pyjwt[crypto]>=2.8.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "autopep8>=2.3.1",
    "black>=24.8.0",
    "isort>=5.13.2",
    "jupyter>=1.1.1",
    "jupyterlab>=4.2.5",
    "nest-asyncio>=1.6.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "reportlab>=4.4.9",
    "ruff>=0.11.11",
    "testcontainers[mssql]>=4.8.0",
]

[tool.setuptools]
# See https://stackoverflow.com/questions/72294299/multiple-top-level-packages-discovered-in-a-flat-layout
py-modules = []

[tool.pytest.ini_options]
# Pytest configuration for src API tests

# Test discovery
testpaths = ["src/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Async support
asyncio_mode = "auto"

# Markers for test categorization
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test multiple components together", 
    "api: API endpoint tests",
    "slow: Tests that take a long time to run",
    "requires_openai: Tests that require OpenAI API access",
    "requires_chromadb: Tests that require ChromaDB to be available",
    "requires_sqlserver: Tests that require SQL Server to be available"
]

# Test output configuration
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    # "--cov-fail-under=30",
    "--durations=10"
]

# Minimum version requirements
minversion = "6.0"

# Warnings configuration
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning", 
    "ignore::UserWarning:chromadb.*",
    "ignore::UserWarning:transformers.*"
]

# Note: Environment variables and timeout are handled by the test runner script
# See scripts/run_tests.py for environment setup

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "src/main_api.py",
    "src/api/v2/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "migrations",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise statements should use exception chaining
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"src/tests/*" = ["B011"]  # Allow assert False in tests

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  migrations
  | .git
  | .pytest_cache
  | .ruff_cache  
  | .venv
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
