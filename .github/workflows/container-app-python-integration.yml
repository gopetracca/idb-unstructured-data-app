name: Container Apps Python Integration

on:

  workflow_call:
    inputs:
      python-version:
        description: Python version for uv / test runner
        type: string
        default: '3.12'
      test-command:
        description: Command passed to 'uv run' (e.g. "pytest -m unit --no-cov")
        type: string
        default: 'pytest -m unit --no-cov'
    # [IDB-ONLY] SONAR_TOKEN feeds the dx-developer-platform SonarQube action
    # commented out below. Declaring it required would break every caller that
    # can no longer supply it. Restore together with the scan step.
    # secrets:
    #   SONAR_TOKEN:
    #     required: true

  workflow_dispatch:
    inputs:
      python-version:
        description: Python version for uv / test runner
        type: string
        default: '3.12'
      test-command:
        description: Command passed to 'uv run' (e.g. "pytest -m unit --no-cov")
        type: string
        default: 'pytest -m unit --no-cov'

jobs:
  python-ci:
    name: Python Continuous Integration
    runs-on: ubuntu-latest
    # [IDB-ONLY] The 'continuous-integration' GitHub Environment exists to hold
    # PROJECT_KEY / PROJECT_NAME for the SonarQube scan. Restore with that step.
    # environment: continuous-integration

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
  
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit tests
      run: uv run ${{ inputs.test-command }}
    
    # [IDB-ONLY] Requires the private dx-developer-platform org action; outside
    # the IDB organization the workflow fails at action resolution before any
    # step runs. Restore when this repository lives in that organization.
    # - name: Run SonarQube Scan
    #   uses: dx-developer-platform/github-wf-core-sonarqube-action/scan-generic@v1
    #   with:
    #     sonar-token: ${{ secrets.SONAR_TOKEN }}
    #     sonar-project-key: ${{ vars.PROJECT_KEY }}
    #     sonar-project-name: ${{ vars.PROJECT_NAME }}

  docker-build:
    needs: python-ci
    uses: ./.github/workflows/container-docker-build.yml
