name: Container Apps Delivery

on:
  # Called as a reusable from continuous-integration.yml
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to run in (e.g. development, staging, production)
        required: false
        type: string
        default: development

  # Build and push sha-<short> tag on every merge to main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '**.txt'

  # Allow manual trigger (e.g. rebuild a specific commit)
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/container-build-acr.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
