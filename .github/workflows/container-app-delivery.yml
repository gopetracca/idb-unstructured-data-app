name: Container Apps Delivery

# Reusable wrapper around the ACR build. Builds and pushes an image tagged with
# the commit SHA (and, for v* tag pushes, with the version + latest). Exposes
# the primary immutable tag so callers can chain a deploy job.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to run in (e.g. development, staging, production)
        required: false
        type: string
        default: development
    outputs:
      image-tag:
        description: Primary immutable tag pushed (sha-<short> or v*)
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      image-tags:
        description: Comma-separated list of all tags pushed
        value: ${{ jobs.build-and-push.outputs.image-tags }}

jobs:
  build-and-push:
    uses: ./.github/workflows/container-build-acr.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
