name: CD - Development (auto)

# Auto-deploy to the development environment on every push to the develop
# branch. Pipeline: CI (tests + sonar) -> build & push image to ACR -> deploy
# revision to the development Container App.

on:
  push:
    branches:
      - develop
    # Documentation-only changes do not affect the built artifact, so they do
    # not run the pipeline. Keep .github/** OUT of this list: a workflow change
    # must exercise itself. A docs-only push therefore leaves the deployed
    # revision as it is, which is correct: nothing in the image changed.
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'

  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/container-app-python-integration.yml
    # [IDB-ONLY] Restore alongside the SonarQube scan step in the called workflow.
    # secrets:
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: ci
    uses: ./.github/workflows/container-app-delivery.yml
    secrets: inherit
    with:
      environment: development

  deploy:
    needs: build
    uses: ./.github/workflows/continuous-deployment-container-apps.yml
    secrets: inherit
    with:
      environment: development
      image-tag: ${{ needs.build.outputs.image-tag }}
