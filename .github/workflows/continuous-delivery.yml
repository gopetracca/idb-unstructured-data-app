name: Continuous Delivery (release tag)

# Triggered when a v* tag is pushed. Builds and pushes an image tagged with the
# version (e.g. v1.2.3) plus 'latest' and 'sha-<short>'. Does NOT deploy.
# To roll out a release, manually run "Continuous Deployment - Container Apps"
# (continuous-deployment.yml) picking the target environment + this image tag.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment whose creds are used for the ACR build (ACR is shared across envs)
        required: false
        type: environment
        default: development

jobs:
  build:
    uses: ./.github/workflows/container-app-delivery.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment || 'development' }}
