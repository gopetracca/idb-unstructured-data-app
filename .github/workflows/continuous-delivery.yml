name: Continuous Delivery
on:
  # Runs when there is a push to the specified branches. If the commit only affects files in 'paths-ignore', the workflow will not run.
  push:
    tags:
        - "v*"

  
  # Allows manual execution of the workflow from the GitHub UI
  workflow_dispatch:
jobs:
  continuous-delivery:
    uses: dx-developer-platform/az-wf-github-core-workflows/.github/workflows/continuous-delivery-python.yml@v1
    secrets:
      JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
